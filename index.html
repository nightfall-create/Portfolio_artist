<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" href="/images/icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Estonia&family=Manufacturing+Consent&family=Sancreek&family=WindSong:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>artist</title>
  </head>

  <body>
    <!-- HERO -->
    <div class="hero">
      <h1 class="hero-title">R'A-in-Bow</h1>

      <img src="../images/l.png" alt="画像" width="500" />
    </div>

    <main>
      <!-- MEMBER -->
      <section class="section">
        <h2 class="section-title">MEMBER</h2>

        <div class="card-grid">
          <!-- hyde -->
          <div class="card">
            <img
              id="photo1"
              class="photo"
              src="../images/h.png"
              alt="hyde"
              data-number="0"
              onclick="changeImage('photo1')"
            />

            <h3>jekyll</h3>
            <p>ヴォーカル</p>
            <p>唯一無二の歌声を持つフロントマン</p>
          </div>

          <div class="card">
            <img
              id="photo2"
              class="photo"
              src="../images/k.png"
              alt="ken"
              data-number="0"
              onclick="changeImage('photo2')"
            />

            <h3>sword</h3>
            <p>ギター</p>
            <p>メロディを彩るギターの魔術師</p>
          </div>

          <div class="card">
            <img
              id="photo3"
              class="photo"
              src="../images/t.png"
              alt="tetsu"
              data-number="0"
              onclick="changeImage('photo3')"
            />

            <h3>metal</h3>
            <p>ベース</p>
            <p>バンドを支える華麗なるベーシスト</p>
          </div>

          <div class="card">
            <img
              id="photo4"
              class="photo"
              src="../images/y.png"
              alt="yukihiro"
              data-number="0"
              onclick="changeImage('photo4')"
            />

            <h3>douala</h3>
            <p>ドラム</p>
            <p>サウンドを貫く精密なリズムメーカー</p>
          </div>
        </div>
      </section>

      <!-- DISCOGRAPHY -->
      <section class="section box-section">
        <h2 class="section-title">Discography</h2>

        <p>Single</p>
        <p>Album</p>
      </section>

      <!-- BIOGRAPHY -->
      <section class="section box-section">
        <h2 class="section-title">Biography</h2>

        <p>LIVE</p>
        <p>LIFE</p>
      </section>

      <!-- SHOP -->
      <section class="section box-section">
        <h2 class="section-title">SHOP</h2>

        <p>goods</p>
      </section>

      <!-- LINK -->
      <section class="section box-section">
        <h2 class="section-title">LINK</h2>

        <p>hyde</p>
        <p>ken</p>
        <p>tetsuya</p>
        <p>yukihiro</p>
      </section>
    </main>

    <footer class="footer">©2026 35th L'Anniversary</footer>

    <script src="/js/script.js"></script>
  </body>
</html>
